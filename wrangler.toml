#:schema node_modules/wrangler/config-schema.json
name = "nuxiox"
main = "./.output/server/index.mjs"
compatibility_date = "2024-11-01"
account_id = "ca41fdb3e1d2eb4550c19aa8d740700d"

# ── Image optimization ─────────────────────────────────────────────────
# Cloudflare Polish (automatic WebP/AVIF conversion at the edge, zero
# Workers CPU time) is a ZONE-level setting — it CANNOT be configured here.
# Enable it via:
#   • Dashboard:  Speed → Optimization → Polish → Lossy
#   • Setup CLI:  pnpm run setup → Cloudflare Deployment → enable Polish
#   • API:        PATCH /zones/{zone_id}/settings/polish {"value":"lossy"}

# This defines where your static assets (images, JS, CSS) live after building
assets = { directory = "./.output/public/", binding = "ASSETS" }

[[d1_databases]]
binding = "DB"
database_name = "nuxiox_db"
database_id = "99c1b9e0-3b68-4f1e-8c67-075cc713d349"
migrations_dir = "./server/database/migrations"

[[kv_namespaces]]
binding = "MEDIA_KV"
id = "d2ace81ff70b4f9b83d76b53fc2591aa"
preview_id = "d2ace81ff70b4f9b83d76b53fc2591aa"

# ── Webhook secrets ────────────────────────────────────────────────────
# BOXAPI_WEBHOOK_SECRET is used to verify HMAC signatures on incoming
# Instagram webhook events from BoxAPI. Set this via wrangler secret:
#   echo "BOXAPI_WEBHOOK_SECRET=<value>" | wrangler secret put BOXAPI_WEBHOOK_SECRET
# Or add to [vars] below for non-sensitive dev values:
# [vars]
# BOXAPI_WEBHOOK_SECRET = "your-dev-secret"

# ── BoxAPI OAuth ─────────────────────────────────────────────────────────
# BOXAPI_API_KEY is used to authenticate with the BoxAPI service for
# Instagram OAuth flow and other integrations. Set this via wrangler secret:
#   echo "BOXAPI_API_KEY=<value>" | wrangler secret put BOXAPI_API_KEY
# Or add to [vars] below for non-sensitive dev values:
# [vars]
# BOXAPI_API_KEY = "your-dev-api-key"

